[package]
name = "teacher-studio"
version = "0.1.0"
description = "Offline teaching notes and document annotation"
authors = ["Teacher Studio contributors"]
edition = "2021"

[lib]
name = "teacher_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
rfd = "0.15"
tempfile = "3"
url = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
